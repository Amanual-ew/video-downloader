<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Social Video Downloader</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Video Downloader By Amanual Ewunetu</h1>

        <p>Download videos from supported social platforms.</p>

        <div class="search-box">

            <input
                type="text"
                id="videoUrl"
                placeholder="Paste video URL here..."
            >

            <button id="infoBtn">
                Get Video
            </button>

        </div>

        <div id="result"></div>

    </main>

    <script src="script.js"></script>

</body>
</html>
